[project]
name = "hams-tts"
version = "0.1.0"
description = "Low-latency Levantine Arabic / English code-switching TTS (Hams.AI assessment)"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.4",
    "torchaudio>=2.4",
    "transformers>=4.45",
    "accelerate>=0.34",
    "datasets[audio]>=2.20",
    "soundfile>=0.12",
    "librosa>=0.10",
    "phonemizer>=3.2",
    "pyarabic>=0.6.15",
    "mishkal>=0.4.1",
    "num2words>=0.5.13",
    "unicodedata2>=15.1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "websockets>=13.0",
    "python-dotenv>=1.0",
    "huggingface_hub[cli]>=0.25",
    "cython>=3.0",
    "scipy>=1.14",
    "numpy>=2.0",
    "matplotlib>=3.9",
    "jiwer>=3.0",
    "faster-whisper>=1.0",
    "onnx>=1.16",
    "onnxruntime-gpu>=1.19",
    "pytest>=8.0",
    "pipecat-ai>=0.0.108",
    "tensorboard>=2.21.0",
    "speechmos>=0.0.1.1",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu124" }]
torchaudio = [{ index = "pytorch-cu124" }]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.setuptools]
packages = ["hams_tts"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"
